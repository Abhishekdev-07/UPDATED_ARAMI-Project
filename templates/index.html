<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IVORY - Historical News Reels</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700&family=Roboto+Slab:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --background-color: #fdf6e3;
            --text-color: #584b3d;
            --header-font: 'Roboto Slab', serif;
            --body-font: 'Lora', serif;
            --accent-color: #a58d71;
        }
        body { margin: 0; background-color: var(--background-color); color: var(--text-color); font-family: var(--body-font); overflow: hidden; }
        h1, h2, h3 { font-family: var(--header-font); font-weight: 700; }

        .view { height: 100vh; width: 100vw; position: absolute; top: 0; left: 0; transition: opacity 0.5s ease-in-out, visibility 0.5s; }
        .view.hidden { opacity: 0; visibility: hidden; pointer-events: none; }

        #home-view { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 20px; box-sizing: border-box; }
        #home-view h1 { font-size: 5.5vw; margin: 0; color: #4a3f32; }
        #home-view .tagline { font-size: 1.2vw; margin-bottom: 40px; color: var(--accent-color); }
        #search-box { display: flex; border: 1px solid var(--accent-color); border-radius: 50px; padding: 5px; width: clamp(300px, 50vw, 600px); background: #fff; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        #search-box input { flex-grow: 1; border: none; background: transparent; outline: none; font-family: var(--body-font); font-size: 16px; padding: 10px; color: var(--text-color); }
        #search-box button { background: var(--text-color); color: var(--background-color); border: none; border-radius: 50%; width: 40px; height: 40px; font-size: 20px; cursor: pointer; transition: transform 0.2s; }
        #search-box button:hover { transform: scale(1.1); }
        .instructions { margin-top: 20px; color: #aaa; }

        #feed-container { height: 100vh; width: 100vw; overflow-y: scroll; scroll-snap-type: y mandatory; scroll-behavior: smooth; }
        .news-card { height: 100vh; width: 100vw; scroll-snap-align: start; position: relative; display: flex; flex-direction: column; justify-content: center; padding: 40px; box-sizing: border-box; border-bottom: 1px dashed var(--accent-color); }
        .card-content { max-width: 800px; margin: 0 auto; }
        .card-content h1 { font-size: 36px; line-height: 1.2; margin-bottom: 10px; }
        .meta { font-family: var(--header-font); font-size: 14px; color: var(--accent-color); margin-bottom: 20px; text-transform: uppercase; }
        .summary-box { border-left: 3px solid var(--accent-color); padding: 5px 20px; margin-top: 20px; }
        .summary-text { font-size: 17px; line-height: 1.7; font-style: italic; }
        .btn-read-more { display: inline-block; margin-top: 20px; color: var(--accent-color); text-decoration: none; font-weight: bold; }
        .loader { text-align: center; font-family: var(--header-font); color: var(--accent-color); }

        #top-left-nav { position: fixed; top: 20px; left: 20px; z-index: 100; cursor: pointer; font-family: var(--header-font); font-weight: bold; background: rgba(253, 246, 227, 0.7); padding: 5px 10px; border-radius: 10px; backdrop-filter: blur(5px); }
        #top-left-nav.hidden { display: none; }
    </style>
</head>
<body>

    <div id="top-left-nav" class="hidden" onclick="showView('home-view')">
        ‹ Back to Search
    </div>

    <div id="home-view" class="view">
        <h1>IVORY</h1>
        <p class="tagline">An AI-powered journey through historical news archives.</p>
        <div id="search-box">
            <input type="text" id="searchInput" placeholder="Search for a topic (e.g., aviation, suffrage)..." onkeyup="searchOnEnter(event)">
            <button onclick="startSearch()">→</button>
        </div>
        <p id="home-instructions" class="instructions">Press '→' to explore general history or enter a topic.</p>
    </div>

    <div id="feed-view" class="view hidden">
        <div id="feed-container"></div>
    </div>

    <script>
        const homeView = document.getElementById('home-view');
        const feedView = document.getElementById('feed-view');
        const nav = document.getElementById('top-left-nav');
        const container = document.getElementById('feed-container');

        let currentPage = 1;
        let currentQuery = 'history';
        let isLoading = false;

        function showView(viewId) {
            if (viewId === 'home-view') {
                homeView.classList.remove('hidden');
                feedView.classList.add('hidden');
                nav.classList.add('hidden');
            } else {
                homeView.classList.add('hidden');
                feedView.classList.remove('hidden');
                nav.classList.remove('hidden');
            }
        }

        function renderArticles(articles, append = false) {
            if (!append) {
                container.innerHTML = "";
            }

            if (articles.length === 0 && !append) {
                container.innerHTML = `<div class="news-card" style="justify-content:center; text-align:center;"><div class="card-content"><h1>No Results</h1><p>No articles found for your query. Try a different search term.</p></div></div>`;
                return;
            }

            articles.forEach(article => {
                const card = document.createElement('div');
                card.className = 'news-card';
                card.innerHTML = `
                    <div class="card-content">
                        <p class="meta">
                            ${article.source || 'Unknown Source'} • 
                            ${article.date || 'Unknown Date'}
                        </p>
                        <h1>${article.title}</h1>
                        <div class="summary-box">
                            <p class="summary-text">
                                ${article.summary}
                            </p>
                        </div>
                        ${article.link ? `<a href="${article.link}" target="_blank" class="btn-read-more">View Original Page ›</a>` : ''}
                    </div>
                `;
                container.appendChild(card);
            });
        }

        async function fetchAndRender(query, page, append = false) {
            if (isLoading) return;
            isLoading = true;
            if (!append) {
                 container.innerHTML = `<div class="news-card loader" style="justify-content:center;"><h2>Searching archives for '${query}'...</h2></div>`;
            }

            try {
                const response = await fetch(`/search?q=${encodeURIComponent(query)}&page=${page}`);
                const articles = await response.json();
                if (articles.error) throw new Error(articles.error);
                
                renderArticles(articles, append);
                currentPage = page;

            } catch (e) {
                container.innerHTML = `<div class="news-card" style="justify-content:center; text-align:center;"><div class="card-content"><h1>Error</h1><p>Could not fetch data from the server: ${e.message}</p></div></div>`;
            } finally {
                isLoading = false;
            }
        }

        function startSearch() {
            const query = document.getElementById('searchInput').value.trim();
            currentQuery = query || 'history'; // Default search if empty
            currentPage = 1;
            fetchAndRender(currentQuery, currentPage, false);
            showView('feed-view');
        }

        function searchOnEnter(event) {
            if (event.key === 'Enter') {
                startSearch();
            }
        }

        // --- Infinite Scroll ---
        container.addEventListener('scroll', () => {
            const { scrollTop, scrollHeight, clientHeight } = container;
            // Fetch next page when user is 90% of the way to the bottom
            if (scrollTop + clientHeight >= scrollHeight * 0.9 && !isLoading) {
                fetchAndRender(currentQuery, currentPage + 1, true);
            }
        });

    </script>
</body>
</html>
