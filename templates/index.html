<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARAMI - News Reels</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        /* --- RESET & BASE --- */
        body { 
            margin: 0; 
            background: #000; 
            color: white; 
            font-family: 'Inter', sans-serif; 
            overflow: hidden; /* Hide main scrollbar */
        }

        /* --- THE INFINITE FEED CONTAINER --- */
        #feed-container {
            height: 100vh;
            width: 100vw;
            overflow-y: scroll;
            scroll-snap-type: y mandatory; /* TIKTOK MAGIC: Forces snap to card */
            scroll-behavior: smooth;
        }

        /* --- NEWS CARD --- */
        .news-card {
            height: 100vh;
            width: 100vw;
            scroll-snap-align: start;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: flex-end; /* Text at bottom */
            padding: 30px;
            box-sizing: border-box;
            background: #111;
            background-size: cover;
            background-position: center;
        }

        /* Dark Overlay so text is readable */
        .overlay {
            position: absolute; top:0; left:0; right:0; bottom:0;
            background: linear-gradient(0deg, rgba(0,0,0,1) 10%, rgba(0,0,0,0.4) 50%, rgba(0,0,0,0.1) 100%);
            z-index: 1;
        }

        /* --- CARD CONTENT --- */
        .content {
            position: relative;
            z-index: 2;
            margin-bottom: 50px;
            max-width: 800px;
            margin-left: auto; margin-right: auto;
        }

        h1 { 
            font-size: 32px; 
            line-height: 1.2; 
            margin-bottom: 10px; 
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }
        
        .meta { 
            font-size: 14px; 
            color: #bbb; 
            margin-bottom: 20px; 
            text-transform: uppercase; 
            letter-spacing: 1px;
            font-weight: 700;
        }

        /* --- GLASS SUMMARY BOX --- */
        .summary-box {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            padding: 20px;
            min-height: 100px;
            margin-top: 20px;
            transition: all 0.3s ease;
        }

        .summary-text {
            font-size: 16px;
            line-height: 1.6;
            color: #eee;
        }

        /* --- BUTTONS --- */
        .btn-summarize {
            background: #2563eb;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 30px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
            transition: transform 0.1s;
        }
        .btn-summarize:active { transform: scale(0.98); }

        .btn-read-more {
            display: block;
            text-align: center;
            margin-top: 15px;
            color: #888;
            text-decoration: none;
            font-size: 12px;
        }

        /* --- SEARCH BAR FLOATING --- */
        #top-bar {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            display: flex;
            gap: 10px;
            background: rgba(0,0,0,0.6);
            padding: 10px;
            border-radius: 50px;
            backdrop-filter: blur(10px);
        }
        input { 
            background: transparent; border: none; color: white; 
            padding: 5px 10px; outline: none; width: 150px; text-align: center;
        }
        .btn-go {
            background: white; color: black; border: none;
            border-radius: 50%; width: 30px; height: 30px;
            font-weight: bold; cursor: pointer;
        }

        /* --- LOADING ANIMATION --- */
        .loader {
            display: inline-block;
            width: 20px; height: 20px;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
            margin-right: 10px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

    </style>
</head>
<body>

    <div id="top-bar">
        <input type="text" id="topicInput" placeholder="Topic (e.g. AI, Space)" value="Technology">
        <button class="btn-go" onclick="loadFeed()">→</button>
    </div>

    <div id="feed-container">
        <div class="news-card" style="background: #111;">
            <div class="content" style="text-align: center;">
                <h1>ARAMI NEWS</h1>
                <p class="meta">Powered by BART-Large AI</p>
                <div class="summary-box" style="background: transparent; border: none;">
                    Swipe Up or Enter a Topic to Start ⬇️
                </div>
            </div>
        </div>
    </div>

    <script>
        async function loadFeed() {
            const topic = document.getElementById('topicInput').value;
            const container = document.getElementById('feed-container');
            
            // Show loading state (optional)
            // fetch data...
            const response = await fetch('/get_feed', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({topic: topic})
            });
            const data = await response.json();
            
            // Clear current cards (except the first welcome one if you want, or clear all)
            container.innerHTML = ""; 

            // Create Colors for cards without images
            const gradients = [
                "linear-gradient(45deg, #FF9A9E 0%, #FECFEF 99%, #FECFEF 100%)",
                "linear-gradient(120deg, #84fab0 0%, #8fd3f4 100%)",
                "linear-gradient(120deg, #a18cd1 0%, #fbc2eb 100%)",
                "linear-gradient(to top, #30cfd0 0%, #330867 100%)"
            ];

            data.articles.forEach((article, index) => {
                const card = document.createElement('div');
                card.className = 'news-card';
                
                // Set Background (Image or Gradient)
                if(article.image) {
                    card.style.backgroundImage = `url('${article.image}')`;
                } else {
                    const randomGrad = gradients[index % gradients.length];
                    card.style.background = randomGrad;
                }

                card.innerHTML = `
                    <div class="overlay"></div>
                    <div class="content">
                        <p class="meta">${article.source} • ${new Date(article.date).toLocaleDateString()}</p>
                        <h1>${article.title}</h1>
                        
                        <div class="summary-box" id="box-${index}">
                            <button class="btn-summarize" onclick="summarizeArticle('${article.link}', ${index})">
                                ✨ Summarize with AI
                            </button>
                        </div>
                        
                        <a href="${article.link}" target="_blank" class="btn-read-more">Read Original Article</a>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        async function summarizeArticle(url, index) {
            const box = document.getElementById(`box-${index}`);
            
            // UI: Loading State
            box.innerHTML = `<div style="display:flex; align-items:center; justify-content:center; height:50px; color:#aaa;">
                                <div class="loader"></div> Reading article...
                             </div>`;
            
            try {
                const response = await fetch('/summarize', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({url: url})
                });
                const data = await response.json();
                
                // UI: Show Result
                // We use a simple fade-in effect via HTML replacement
                box.innerHTML = `<p class="summary-text">${data.summary}</p>`;
                
            } catch (e) {
                box.innerHTML = `<p style="color: #ff6b6b;">Error: Could not read article. Try another one.</p>`;
            }
        }

        // Load default topic on startup
        window.onload = loadFeed;
    </script>
</body>
</html>
